<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../corpmail.css"><title>03 lobby (host view)</title></head><body>
<div id="app">
  <div class="win">
    <div class="win-bar"><span class="dots">●●●</span><span>Conference Room</span><span class="bar-right">Lobby</span></div>
    <div class="win-body center">
      <div class="eyebrow">Tell your coworkers the code</div>
      <div class="roomcode">SYNR</div>
      <div class="small">They tap “Join a party” on their phone</div>
    </div>
  </div>
  <div class="win">
    <div class="win-bar"><span class="dots">●●●</span><span>Attendees</span><span class="bar-right">4 badged in</span></div>
    <div class="win-body">
      <div class="badge"><div class="clip"></div><div><div class="nm">Alice</div><div class="ti">VP of Vibes</div></div><span class="host-tag">THE BOSS</span></div>
      <div class="badge"><div class="clip"></div><div><div class="nm">Bob</div><div class="ti">Chief Snack Officer</div></div></div>
      <div class="badge"><div class="clip"></div><div><div class="nm">Dana</div><div class="ti">Head of Circling Back</div></div></div>
      <div class="badge"><div class="clip"></div><div><div class="nm">Greg</div><div class="ti">Intern (Year 9)</div></div></div>
      <label>Rounds</label>
      <div class="seg"><button>2</button><button class="on">3</button><button>4</button><button>5</button></div>
      <button class="btn red">Call the meeting to order</button>
      <button class="btn ghost slim">Cancel party</button>
    </div>
  </div>
</div>
</body></html>
