<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../corpmail.css"><title>07 writing — outbox / waiting</title></head><body>
<div id="app">
  <div class="topbar"><span class="round">Round 2 of 3</span><span class="timer late">OVERDUE</span></div>
  <div class="win">
    <div class="win-bar"><span class="dots">●●●</span><span>Outbox</span><span class="bar-right">sent ✓</span></div>
    <div class="win-body waiting">
      <div class="stamp green">SENT</div>
      <div class="progress-line mt16">2 of 4 emails in</div>
      <div class="small center">Still typing: Dana, Greg</div>
      <button class="btn ghost slim">Close submissions early</button>
    </div>
  </div>
</div>
</body></html>
