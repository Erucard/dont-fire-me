<style>
:root{
  --bg:#DFE3EA;
  --surface:#FFFFFF;
  --surface2:#F4F5F8;
  --ink:#1A2433;
  --muted:#5B6575;
  --line:#C7CDD8;
  --navy:#1E3A6E;
  --navy-d:#152A52;
  --stamp:#C03B2D;
  --sticky:#FFE066;
  --sticky-d:#8A6D00;
  --approve:#2E7D5B;
  --gold:#B98A1C;
  --sans:'IBM Plex Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --serif:'IBM Plex Serif',Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);
  background-image:repeating-linear-gradient(0deg,rgba(30,58,110,.025) 0 1px,transparent 1px 28px);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.5;
  min-height:100vh;
}
#app{max-width:540px;margin:0 auto;padding:14px 14px 60px}
a{color:var(--navy)}

/* ---------- window chrome (the signature) ---------- */
.win{background:var(--surface);border:1px solid var(--navy-d);box-shadow:0 3px 0 rgba(21,42,82,.28);margin-bottom:16px}
.win-bar{background:var(--navy);color:#fff;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:7px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.win-bar .dots{letter-spacing:2px;font-size:10px;opacity:.85;flex:none}
.win-body{padding:16px}
.win-bar .bar-right{font-size:10px;opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- stamps ---------- */
.stamp{
  display:inline-block;font-family:var(--mono);font-weight:700;text-transform:uppercase;
  letter-spacing:.18em;color:var(--stamp);border:3px double var(--stamp);
  padding:3px 12px;transform:rotate(-5deg);font-size:14px;
  mask-image:radial-gradient(circle at 30% 40%, black 92%, transparent 100%);
}
.stamp.green{color:var(--approve);border-color:var(--approve)}
.stamp.gold{color:var(--gold);border-color:var(--gold)}
.stamp.big{font-size:22px;padding:6px 18px;border-width:4px}

/* ---------- type ---------- */
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
h1,h2{line-height:1.15}
.small{font-size:13px;color:var(--muted)}
.mono{font-family:var(--mono)}

/* ---------- controls ---------- */
.btn{
  display:block;width:100%;font-family:var(--mono);font-size:14px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;cursor:pointer;
  background:var(--navy);color:#fff;border:1px solid var(--navy-d);
  box-shadow:0 3px 0 var(--navy-d);padding:14px 16px;margin-top:10px;
}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--navy-d)}
.btn.red{background:var(--stamp);border-color:#8F2A20;box-shadow:0 3px 0 #8F2A20}
.btn.red:active{box-shadow:0 1px 0 #8F2A20}
.btn.ghost{background:var(--surface2);color:var(--navy);border:1px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.ghost:active{box-shadow:0 1px 0 var(--line)}
.btn.slim{padding:9px 12px;font-size:12px;margin-top:8px}
.btn[disabled]{opacity:.45;pointer-events:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--sticky);outline-offset:1px}
label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:12px 0 4px}
input[type=text],textarea{
  width:100%;border:1px solid var(--line);background:var(--surface);
  font-family:var(--sans);font-size:16px;padding:11px 12px;color:var(--ink);border-radius:0;
}
textarea{font-family:var(--serif);min-height:170px;resize:vertical;line-height:1.6}
input.code{font-family:var(--mono);text-transform:uppercase;letter-spacing:.4em;font-size:22px;text-align:center}

/* ---------- home hero ---------- */
.hero{text-align:center;padding:34px 8px 20px;position:relative}
.hero .fireme{font-family:var(--sans);font-weight:700;font-size:clamp(58px,17vw,86px);letter-spacing:-.03em;line-height:.95;color:var(--ink)}
.hero .dont{
  position:absolute;top:8px;left:50%;transform:translateX(-78%) rotate(-9deg);
  font-family:var(--mono);font-weight:700;font-size:clamp(24px,7vw,34px);letter-spacing:.22em;
  color:var(--stamp);border:4px double var(--stamp);padding:2px 14px;background:rgba(255,255,255,.72);
}
.hero .tag{margin-top:14px;font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

/* ---------- lobby badges ---------- */
.badge{
  display:flex;align-items:center;gap:12px;border:1px solid var(--line);
  background:var(--surface2);padding:10px 12px;margin-top:8px;
}
.badge .clip{width:10px;height:26px;border:2px solid var(--muted);border-radius:5px;flex:none;background:var(--surface)}
.badge .nm{font-weight:700}
.badge .ti{font-size:12px;color:var(--muted);font-family:var(--mono)}
.badge .host-tag{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--approve);border:1px solid var(--approve);padding:1px 6px;flex:none}
.roomcode{font-family:var(--mono);font-weight:700;font-size:44px;letter-spacing:.35em;text-align:center;padding:10px 0 4px;text-indent:.35em}
.seg{display:flex;gap:6px;margin-top:4px}
.seg button{flex:1;font-family:var(--mono);font-size:14px;padding:9px 0;background:var(--surface2);border:1px solid var(--line);cursor:pointer;color:var(--ink)}
.seg button.on{background:var(--navy);color:#fff;border-color:var(--navy-d)}

/* ---------- incoming email / memo ---------- */
.mail-head{border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:10px}
.mail-head .row{display:flex;gap:8px;font-size:13px;margin-top:2px}
.mail-head .k{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);width:64px;flex:none;padding-top:2px}
.mail-head .v{font-weight:600}
.mail-body{font-family:var(--serif);font-size:15px;line-height:1.65;white-space:pre-wrap}
.thread-msg{border-left:3px solid var(--line);padding:6px 0 6px 12px;margin-top:10px}
.thread-msg .tfrom{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.thread-msg .ttext{font-family:var(--serif);font-size:15px;line-height:1.55;white-space:pre-wrap}
.task-note{
  background:var(--sticky);border:1px solid #E3C337;padding:10px 12px;margin-top:12px;
  font-size:14px;font-weight:600;box-shadow:2px 3px 0 rgba(26,36,51,.15);transform:rotate(.4deg);
}
.task-note .k{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--sticky-d);display:block;margin-bottom:2px}

/* ---------- topbar / timer ---------- */
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.topbar .round{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.timer{font-family:var(--mono);font-weight:700;font-size:15px;border:1px solid var(--line);background:var(--surface);padding:3px 10px}
.timer.late{color:var(--stamp);border-color:var(--stamp)}

/* ---------- rating cards ---------- */
.rate-card{margin-bottom:16px}
.stars{display:flex;gap:4px;justify-content:center;padding:6px 0 2px}
.stars button{font-size:34px;line-height:1;background:none;border:none;cursor:pointer;color:#C9CFDA;padding:4px 6px}
.stars button.on{color:var(--gold)}
.stars-label{text-align:center;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);min-height:16px}
.own-note{text-align:center;padding:8px 0 4px}

/* ---------- results ---------- */
.result-row{border:1px solid var(--line);background:var(--surface2);padding:10px 12px;margin-top:8px}
.result-row .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.result-row .who{font-weight:700}
.result-row .score{font-family:var(--mono);font-weight:700;flex:none}
.result-row .subj{font-size:13px;color:var(--muted);font-style:italic;font-family:var(--serif)}
.result-row.first{border-color:var(--gold);background:#FBF4DF}
.result-row.last{border-color:var(--stamp);background:#F9E9E6}
.standing{display:flex;justify-content:space-between;font-family:var(--mono);font-size:14px;padding:7px 4px;border-bottom:1px dashed var(--line)}

/* ---------- misc ---------- */
.waiting{ text-align:center;padding:22px 10px}
.waiting .spin{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.progress-line{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center;margin:8px 0}
#toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
  background:var(--ink);color:#fff;font-family:var(--mono);font-size:13px;
  padding:10px 16px;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center;z-index:50;
}
#toast.show{opacity:1}
.footer{margin-top:26px;text-align:center;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.center{text-align:center}
.mt8{margin-top:8px}.mt16{margin-top:16px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.blink{animation:blink 1.4s step-end infinite}
@keyframes blink{50%{opacity:.25}}
</style>
</head>

function saveSession(){ try{ localStorage.setItem('dfm', JSON.stringify({code:S.code, playerId:S.playerId, name:S.name})); }catch(e){} }
function loadSession(){ try{ return JSON.parse(localStorage.getItem('dfm')||'null'); }catch(e){ return null; } }
function clearSession(){ try{ localStorage.removeItem('dfm'); }catch(e){} }

/* ================= UTIL ================= */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function toast(msg){ var t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove('show');},2600); }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function genCode(){ var A='ABCDEFGHJKMNPQRSTUVWXYZ',s=''; for(var i=0;i<4;i++) s+=A[Math.floor(Math.random()*A.length)]; return s; }
function me(){ for(var i=0;i<S.players.length;i++) if(S.players[i].id===S.playerId) return S.players[i]; return null; }
function isHost(){ var m=me(); return !!(m&&m.is_host); }
function roundSubs(){ var r=S.room?S.room.round:0; return S.subs.filter(function(x){return x.round===r;}).sort(function(a,b){return a.id<b.id?-1:1;}); }
function roundRatings(){ var r=S.room?S.room.round:0; return S.ratings.filter(function(x){return x.round===r;}); }
function mySubThisRound(){ var r=roundSubs(); for(var i=0;i<r.length;i++) if(r[i].player_id===S.playerId) return r[i]; return null; }
function playerName(pid){ for(var i=0;i<S.players.length;i++) if(S.players[i].id===pid) return S.players[i].name; return '???'; }

/* ================= DATA ================= */
function refreshSoon(){ clearTimeout(S._rf); S._rf=setTimeout(refresh,120); }
async function refresh(){
  if(!S.code) return;
  try{
    var res = await Promise.all([
      sb.from('rooms').select('*').eq('code',S.code).maybeSingle(),
      sb.from('players').select('*').eq('room_code',S.code).order('joined_at'),
      sb.from('submissions').select('*').eq('room_code',S.code),
      sb.from('ratings').select('*').eq('room_code',S.code)
    ]);
    if(res[0].error) throw res[0].error;
    if(!res[0].data){ leaveToHome('That party has been dissolved by management.'); return; }
    S.room=res[0].data; S.players=res[1].data||[]; S.subs=res[2].data||[]; S.ratings=res[3].data||[];
    render(); hostAutopilot();
  }catch(e){ console.error(e); }
}
function subscribeRoom(){
  if(S.channel) sb.removeChannel(S.channel);
  var tables=['rooms','players','submissions','ratings'];
  var ch=sb.channel('room-'+S.code);
  tables.forEach(function(t){
    ch.on('postgres_changes',{event:'*',schema:'public',table:t,filter:(t==='rooms'?'code':'room_code')+'=eq.'+S.code},refreshSoon);
  });
  ch.subscribe();
  S.channel=ch;
  clearInterval(S.pollTimer);
  S.pollTimer=setInterval(function(){ if(!document.hidden) refresh(); },3000);
  clearInterval(S.tickTimer);
  S.tickTimer=setInterval(tick,500);
}
function leaveToHome(msg){
  if(S.channel){ sb.removeChannel(S.channel); S.channel=null; }
  clearInterval(S.pollTimer); clearInterval(S.tickTimer);
  S.code=null; S.playerId=null; S.room=null; S.players=[]; S.subs=[]; S.ratings=[]; S.viewKey=''; S.submittedRound=0;
  clearSession();
  if(msg) toast(msg);
  renderHome();
}

/* ================= ACTIONS ================= */
async function createParty(){
  var name=$('nameInput').value.trim();
  if(!name){ toast('HR requires a name for your badge.'); return; }
  S.name=name;
  var code=genCode();
  var r=await sb.from('rooms').insert({code:code}).select().single();
  if(r.error){ code=genCode(); r=await sb.from('rooms').insert({code:code}).select().single(); }
  if(r.error){ toast('Could not open a conference room. Try again.'); return; }
  var p=await sb.from('players').insert({room_code:code,name:name,title:pick(TITLES),is_host:true}).select().single();
  if(p.error){ toast('Badge printer jammed. Try again.'); return; }
  S.code=code; S.playerId=p.data.id; saveSession();
  subscribeRoom(); refresh();
}
async function joinParty(){
  var name=$('nameInput').value.trim();
  var code=($('codeInput').value||'').trim().toUpperCase();
  if(!name){ toast('HR requires a name for your badge.'); return; }
  if(code.length!==4){ toast('Room codes are 4 letters.'); return; }
  S.name=name;
  var r=await sb.from('rooms').select('*').eq('code',code).maybeSingle();
  if(r.error||!r.data){ toast('No meeting found in room '+code+'.'); return; }
  if(r.data.phase!=='lobby'){ toast('That meeting is already in progress.'); return; }
  var p=await sb.from('players').insert({room_code:code,name:name,title:pick(TITLES),is_host:false}).select().single();
  if(p.error){ toast('Badge printer jammed. Try again.'); return; }
  S.code=code; S.playerId=p.data.id; saveSession();
  subscribeRoom(); refresh();
}
function pickPrompt(){
  var used=(S.room&&S.room.used_prompts)||[];
  var pool=PROMPTS.filter(function(p){ return used.indexOf(p.id)<0; });
  if(!pool.length) pool=PROMPTS;
  return pick(pool);
}
async function startRound(){
  var p=pickPrompt();
  var used=((S.room&&S.room.used_prompts)||[]).concat([p.id]);
  var deadline=new Date(Date.now()+WRITE_SECONDS*1000).toISOString();
  await sb.from('rooms').update({
    phase:'writing', round:(S.room.round||0)+1, prompt:p, used_prompts:used,
    deadline:deadline, total_rounds:S.room.total_rounds
  }).eq('code',S.code);
  refresh();
}
async function startGame(){
  await sb.from('rooms').update({total_rounds:S.roundsPick}).eq('code',S.code);
  S.room.total_rounds=S.roundsPick;
  await startRound();
}
async function submitEmail(){
  var subj=$('subjInput').value.trim()||'(no subject)';
  var body=$('bodyInput').value.trim();
  if(body.length<3){ toast('Even Greg writes more than that.'); return; }
  $('sendBtn').disabled=true;
  var r=await sb.from('submissions').insert({room_code:S.code,round:S.room.round,player_id:S.playerId,subject:subj,body:body});
  if(r.error && r.error.code!=='23505'){ toast('Send failed. The server is circling back.'); $('sendBtn').disabled=false; return; }
  S.submittedRound=S.room.round; S.viewKey=''; refresh();
}
async function rate(subId,stars){
  await sb.from('ratings').upsert(
    {room_code:S.code,round:S.room.round,submission_id:subId,rater_id:S.playerId,stars:stars},
    {onConflict:'submission_id,rater_id'}
  );
  refresh();
}
async function advance(phase){
  if(S.advancing) return; S.advancing=true;
  await sb.from('rooms').update({phase:phase}).eq('code',S.code);
  S.advancing=false;
  refresh();
}
async function nextOrFinal(){
  if(S.room.round < S.room.total_rounds) await startRound();
  else await advance('final');
}
function hostAutopilot(){
  if(!isHost()||!S.room) return;
  var P=S.players.length;
  if(S.room.phase==='writing'){
    var subs=roundSubs();
    if(P>0 && subs.length>=P) advance('rating');
  } else if(S.room.phase==='rating'){
    var subs2=roundSubs(); var expected=subs2.length*(P-1);
    if(expected>0 && roundRatings().length>=expected) advance('results');
  }
}
function insertJargon(){
  var ta=$('bodyInput'); if(!ta) return;
  var phrase=pick(JARGON);
  var s=ta.selectionStart||ta.value.length, e=ta.selectionEnd||s;
  ta.value=ta.value.slice(0,s)+phrase+ta.value.slice(e);
  ta.focus(); var np=s+phrase.length; ta.setSelectionRange(np,np);
}

/* ================= SCORING ================= */
function scoresForRound(r){
  var subs=S.subs.filter(function(x){return x.round===r;});
  return subs.map(function(sub){
    var rs=S.ratings.filter(function(x){return x.submission_id===sub.id;});
    var avg=rs.length? rs.reduce(function(a,x){return a+x.stars;},0)/rs.length : 0;
    return {sub:sub, avg:avg, n:rs.length, pts:Math.round(avg*20)};
  }).sort(function(a,b){ return b.avg-a.avg || (a.sub.id<b.sub.id?-1:1); });
}
function totals(){
  var t={};
  S.players.forEach(function(p){ t[p.id]={player:p,pts:0}; });
  for(var r=1;r<=(S.room?S.room.round:0);r++){
    scoresForRound(r).forEach(function(row){ if(t[row.sub.player_id]) t[row.sub.player_id].pts+=row.pts; });
  }
  return Object.values(t).sort(function(a,b){return b.pts-a.pts;});
}

/* ================= TIMER ================= */
function tick(){
  var el=$('timer'); if(!el||!S.room||!S.room.deadline) return;
  var left=Math.floor((new Date(S.room.deadline).getTime()-Date.now())/1000);
  if(left<=0){ el.textContent='OVERDUE'; el.classList.add('late'); el.classList.add('blink'); }
  else{
    var m=Math.floor(left/60), s=left%60;
    el.textContent=m+':'+(s<10?'0':'')+s;
    el.classList.toggle('late',left<=30);
  }
}

/* ================= RENDER ================= */
function winTop(title,right){
  return '<div class="win-bar"><span class="dots">●●●</span><span>'+esc(title)+'</span><span class="bar-right">'+esc(right||'')+'</span></div>';
}
function render(){
  if(!S.room){ renderHome(); return; }
  var ph=S.room.phase;
  if(ph==='lobby') renderLobby();
  else if(ph==='writing') renderWriting();
  else if(ph==='rating') renderRating();
  else if(ph==='results') renderResults();
  else if(ph==='final') renderFinal();
}
function setView(key,html){
  if(S.viewKey===key) return false;
  S.viewKey=key; $('app').innerHTML=html; return true;
}

/* ---- home ---- */
function renderHome(){
  var savedName=S.name||'';
  S.viewKey='home';
  $('app').innerHTML =
  '<div class="hero"><div class="fireme">FIRE&nbsp;ME</div><div class="dont">DON\'T</div>'+
  '<div class="tag">The corporate jargon party game</div></div>'+
  '<div class="win">'+winTop('CorpMail™ — Sign In','v0.1')+
    '<div class="win-body">'+
    '<label for="nameInput">Name (as printed on your badge)</label>'+
    '<input type="text" id="nameInput" maxlength="20" autocomplete="off" value="'+esc(savedName)+'" placeholder="e.g. Greg">'+
    '<button class="btn" onclick="createParty()">Start a party</button>'+
    '<div id="joinBlock" style="display:none">'+
      '<label for="codeInput">Conference room code</label>'+
      '<input type="text" id="codeInput" class="code" maxlength="4" autocomplete="off" placeholder="ABCD">'+
      '<button class="btn red" onclick="joinParty()">Join meeting</button>'+
    '</div>'+
    '<button class="btn ghost" id="joinToggle" onclick="document.getElementById(\'joinBlock\').style.display=\'block\';this.style.display=\'none\';document.getElementById(\'codeInput\').focus();">Join a party</button>'+
    '</div></div>'+
  '<div class="footer">CorpMail™ Enterprise Edition · 3–12 players · one phone each</div>';
}

/* ---- lobby ---- */
function renderLobby(){
  var host=isHost();
  var key='lobby:'+S.players.length+':'+(host?S.roundsPick:'')+':'+S.players.map(function(p){return p.id.slice(0,4);}).join('');
  var badges=S.players.map(function(p){
    return '<div class="badge"><div class="clip"></div><div><div class="nm">'+esc(p.name)+'</div><div class="ti">'+esc(p.title)+'</div></div>'+(p.is_host?'<span class="host-tag">THE BOSS</span>':'')+'</div>';
  }).join('');
  var segs=[2,3,4,5].map(function(n){
    return '<button class="'+(S.roundsPick===n?'on':'')+'" onclick="S.roundsPick='+n+';S.viewKey=\'\';render()">'+n+'</button>';
  }).join('');
  var hostBlock = host
    ? '<label>Rounds</label><div class="seg">'+segs+'</div>'+
      '<button class="btn red" '+(S.players.length<2?'disabled':'')+' onclick="startGame()">Call the meeting to order</button>'+
      (S.players.length<3?'<div class="small center mt8">Works best with 3+. Two players is just a 1:1.</div>':'')+
      '<button class="btn ghost slim" onclick="cancelParty()">Cancel party</button>'
    : '<div class="waiting"><div class="spin blink">Waiting for the boss to start…</div></div>'+
      '<button class="btn ghost slim" onclick="leaveParty()">Leave quietly</button>';
  setView(key,
    '<div class="win">'+winTop('Conference Room','Lobby')+
    '<div class="win-body center"><div class="eyebrow">Tell your coworkers the code</div>'+
    '<div class="roomcode">'+esc(S.code)+'</div>'+
    '<div class="small">They tap “Join a party” on their phone</div></div></div>'+
    '<div class="win">'+winTop('Attendees',''+S.players.length+' badged in')+
    '<div class="win-body">'+badges+hostBlock+'</div></div>'
  );
}
async function cancelParty(){ await sb.from('rooms').delete().eq('code',S.code); leaveToHome('Party dissolved.'); }
async function leaveParty(){ await sb.from('players').delete().eq('id',S.playerId); leaveToHome('You slipped out of the meeting.'); }

/* ---- writing ---- */
function promptHTML(p){
  var inner;
  if(p.thread){
    inner=p.thread.map(function(m){
      return '<div class="thread-msg"><div class="tfrom">'+esc(m.from)+'</div><div class="ttext">'+esc(m.text)+'</div></div>';
    }).join('');
  } else {
    inner='<div class="mail-body">'+esc(p.body)+'</div>';
  }
  return '<div class="mail-head">'+
    '<div class="row"><span class="k">From</span><span class="v">'+esc(p.from)+'</span></div>'+
    '<div class="row"><span class="k">To</span><span class="v">You</span></div>'+
    '<div class="row"><span class="k">Subject</span><span class="v">'+esc(p.subject)+'</span></div>'+
  '</div>'+inner+
  '<div class="task-note"><span class="k">Your assignment</span>'+esc(p.task)+'</div>';
}
function renderWriting(){
  var p=S.room.prompt||{};
  var submitted=!!mySubThisRound()||S.submittedRound===S.room.round;
  var key='writing:'+S.room.round+':'+(submitted?'done':'compose');
  var top='<div class="topbar"><span class="round">Round '+S.room.round+' of '+S.room.total_rounds+'</span><span class="timer" id="timer">–:––</span></div>';
  if(!submitted){
    if(setView(key,
      top+
      '<div class="win">'+winTop('Inbox (1 unread)','URGENT')+'<div class="win-body">'+promptHTML(p)+'</div></div>'+
      '<div class="win">'+winTop('Compose reply','draft')+'<div class="win-body">'+
        '<label for="subjInput">Subject</label>'+
        '<input type="text" id="subjInput" maxlength="80" autocomplete="off" value="'+esc('RE: '+(p.subject||''))+'">'+
        '<label for="bodyInput">Message</label>'+
        '<textarea id="bodyInput" maxlength="1200" placeholder="Dear team,"></textarea>'+
        '<button class="btn ghost slim" type="button" onclick="insertJargon()">📎 Insert corporate jargon</button>'+
        '<button class="btn red" id="sendBtn" onclick="submitEmail()">Send (and pray)</button>'+
      '</div></div>'
    )) tick();
  } else {
    var subs=roundSubs();
    var waitingOn=S.players.filter(function(pl){ return !subs.some(function(s){return s.player_id===pl.id;}); }).map(function(pl){return pl.name;});
    var host=isHost();
    if(setView(key+':'+subs.length,
      top+
      '<div class="win">'+winTop('Outbox','sent ✓')+'<div class="win-body waiting">'+
      '<div class="stamp green">SENT</div>'+
      '<div class="progress-line mt16">'+subs.length+' of '+S.players.length+' emails in</div>'+
      (waitingOn.length?'<div class="small center">Still typing: '+esc(waitingOn.join(', '))+'</div>':'')+
      (host&&waitingOn.length?'<button class="btn ghost slim" onclick="advance(\'rating\')">Close submissions early</button>':'')+
      '</div></div>'
    )) tick();
  }
  tick();
}

/* ---- rating ---- */
function renderRating(){
  var subs=roundSubs();
  var mine={};
  roundRatings().forEach(function(r){ if(r.rater_id===S.playerId) mine[r.submission_id]=r.stars; });
  var toRate=subs.filter(function(s){return s.player_id!==S.playerId;});
  var done=Object.keys(mine).length;
  var all=roundRatings().length, expected=subs.length*(S.players.length-1);
  var key='rating:'+S.room.round+':'+JSON.stringify(mine)+':'+all+':'+subs.length;
  var cards=subs.map(function(sub,i){
    var own=sub.player_id===S.playerId;
    var st=mine[sub.id]||0;
    var stars='';
    for(var k=1;k<=5;k++) stars+='<button class="'+(k<=st?'on':'')+'" aria-label="'+k+' stars" onclick="rate(\''+sub.id+'\','+k+')">★</button>';
    return '<div class="win rate-card">'+winTop('From: [REDACTED] — Cubicle '+CUBES[i%CUBES.length],'exhibit '+(i+1)+'/'+subs.length)+
      '<div class="win-body">'+
      '<div class="mail-head"><div class="row"><span class="k">Subject</span><span class="v">'+esc(sub.subject)+'</span></div></div>'+
      '<div class="mail-body">'+esc(sub.body)+'</div>'+
      (own
        ? '<div class="own-note"><span class="stamp">Your email</span><div class="small mt8">You may not review your own performance.</div></div>'
        : '<div class="stars">'+stars+'</div><div class="stars-label">'+(st?esc(STAR_LABELS[st]):'tap to rate')+'</div>')+
      '</div></div>';
  }).join('');
  var host=isHost();
  var footer='<div class="progress-line">You\'ve reviewed '+done+' of '+toRate.length+' · office-wide: '+all+'/'+expected+'</div>'+
    (host?'<button class="btn ghost slim" onclick="advance(\'results\')">Everyone\'s done — reveal results</button>':'');
  setView(key,
    '<div class="topbar"><span class="round">Round '+S.room.round+' — Performance Review</span></div>'+
    '<div class="win">'+winTop('360° Peer Review','anonymous')+'<div class="win-body small">Rate each email. Authors are confidential until the results. Your own is sealed.</div></div>'+
    cards+footer
  );
}

/* ---- results ---- */
function renderResults(){
  var rows=scoresForRound(S.room.round);
  var html=rows.map(function(row,i){
    var cls=i===0?'first':(i===rows.length-1&&rows.length>1?'last':'');
    var mark=i===0?' 🏆':(i===rows.length-1&&rows.length>1?' — PIP':'');
    return '<div class="result-row '+cls+'">'+
      '<div class="top"><span class="who">'+esc(playerName(row.sub.player_id))+esc(mark)+'</span>'+
      '<span class="score">'+row.avg.toFixed(2)+'★ · +'+row.pts+' pts</span></div>'+
      '<div class="subj">“'+esc(row.sub.subject)+'”</div></div>';
  }).join('');
  var t=totals();
  var standings=t.map(function(x,i){
    return '<div class="standing"><span>'+(i+1)+'. '+esc(x.player.name)+'</span><span>'+x.pts+' pts</span></div>';
  }).join('');
  var host=isHost();
  var last=S.room.round>=S.room.total_rounds;
  setView('results:'+S.room.round+':'+S.ratings.length,
    '<div class="topbar"><span class="round">Round '+S.room.round+' of '+S.room.total_rounds+' — Results</span></div>'+
    '<div class="win">'+winTop('Performance Review Results','round '+S.room.round)+'<div class="win-body">'+html+
    '<div class="small center mt8">Read the winners aloud. That\'s the whole point.</div></div></div>'+
    '<div class="win">'+winTop('Running Standings','confidential')+'<div class="win-body">'+standings+'</div></div>'+
    (host
      ?'<button class="btn '+(last?'red':'')+'" onclick="nextOrFinal()">'+(last?'Deliver the final verdict':'Next round')+'</button>'
      :'<div class="waiting"><div class="spin blink">Waiting for the boss…</div></div>')
  );
}

/* ---- final ---- */
function renderFinal(){
  var t=totals();
  if(!t.length){ leaveToHome(); return; }
  var winner=t[0], loser=t[t.length-1];
  var standings=t.map(function(x,i){
    return '<div class="standing"><span>'+(i+1)+'. '+esc(x.player.name)+' <span class="small">('+esc(x.player.title)+')</span></span><span>'+x.pts+' pts</span></div>';
  }).join('');
  var host=isHost();
  setView('final',
    '<div class="win">'+winTop('Final Verdict','HR-approved')+'<div class="win-body center">'+
    '<div class="eyebrow">Employee of the Month</div>'+
    '<div style="font-size:30px;font-weight:700">'+esc(winner.player.name)+'</div>'+
    '<div class="mt8"><span class="stamp gold big">PROMOTED</span></div>'+
    '<div class="small mt8">'+winner.pts+' performance points</div>'+
    '</div></div>'+
    (t.length>1?
    '<div class="win">'+winTop('Also in the mail…','regrettable')+'<div class="win-body center">'+
    '<div style="font-size:24px;font-weight:700">'+esc(loser.player.name)+'</div>'+
    '<div class="mt8"><span class="stamp big">YOU\'RE FIRED</span></div>'+
    '<div class="small mt8">Security will help you find a box for your things.</div>'+
    '</div></div>':'')+
    '<div class="win">'+winTop('Full Standings','')+'<div class="win-body">'+standings+'</div></div>'+
    (host?'<button class="btn" onclick="playAgain()">Rehire everyone (play again)</button>':'')+
    '<button class="btn ghost slim" onclick="leaveToHome()">Back to the parking lot</button>'
  );
}
async function playAgain(){
  await sb.from('submissions').delete().eq('room_code',S.code);
  await sb.from('ratings').delete().eq('room_code',S.code);
  await sb.from('rooms').update({phase:'lobby',round:0,prompt:null,used_prompts:[],deadline:null}).eq('code',S.code);
  S.submittedRound=0;
  refresh();
}

/* ================= BOOT ================= */
(async function(){
  var sess=loadSession();
  if(sess&&sess.code&&sess.playerId){
    var p=await sb.from('players').select('*').eq('id',sess.playerId).maybeSingle();
    if(p.data){
      S.code=sess.code; S.playerId=sess.playerId; S.name=sess.name||p.data.name;
      subscribeRoom(); refresh(); return;
    }
    clearSession();
  }
  renderHome();
})();
</script>
</body>
</html>
